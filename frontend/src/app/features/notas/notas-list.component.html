<div class="breadcrumb"><a routerLink="/produtos">Início</a> / Notas Fiscais</div>

<div class="page-header">
  <h1>Notas Fiscais</h1>
  <div class="toolbar">
    <input
      class="btn search-input"
      placeholder="Buscar por numeração"
      [(ngModel)]="busca"
      (keyup.enter)="carregar()"
    />
    <button class="btn" (click)="carregar()">Filtrar</button>
    <button class="btn btn--primary" routerLink="/notas-fiscais/nova">+ Nova Nota Fiscal</button>
  </div>
</div>

<div class="toolbar" style="margin-bottom:14px">
  <button class="btn" [class.btn--primary]="filtroStatus === ''" (click)="filtrarPorStatus('')">Todas</button>
  <button class="btn" [class.btn--primary]="filtroStatus === 'Aberta'" (click)="filtrarPorStatus('Aberta')">Abertas</button>
  <button class="btn" [class.btn--primary]="filtroStatus === 'Fechada'" (click)="filtrarPorStatus('Fechada')">Fechadas</button>
</div>

<div class="alert alert--erro" *ngIf="erro">{{ erro }}</div>

<div class="card">
  <div class="table-responsive" *ngIf="notas.length > 0">
    <table class="table">
      <thead>
        <tr>
          <th>Numeração</th>
          <th>Status</th>
          <th>Produtos</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let nota of notas">
          <td>{{ numeracaoFormatada(nota.numeracao) }}</td>
          <td>
            <span class="badge" [class.badge--aberta]="nota.status === 'Aberta'" [class.badge--fechada]="nota.status === 'Fechada'">
              {{ nota.status }}
            </span>
          </td>
          <td>{{ nota.quantidade_itens }} {{ nota.quantidade_itens === 1 ? 'item' : 'itens' }} · {{ nota.quantidade_total }} unidades</td>
          <td>
            <button class="btn" (click)="abrir(nota.numeracao)">Abrir</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="empty-state" *ngIf="!carregando && notas.length === 0">
    <p><strong>Nenhuma nota fiscal encontrada</strong></p>
    <button class="btn btn--primary" routerLink="/notas-fiscais/nova">Nova Nota Fiscal</button>
  </div>
</div>
